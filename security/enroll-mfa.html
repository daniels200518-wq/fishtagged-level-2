<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.gstatic.com;
  style-src 'unsafe-inline';
  connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.gstatic.com;
  img-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>Fishtagged security setup</title>
<link rel="icon" href="../assets/fishtagged-logo.png">
<script src="auth-config.js"></script>
<script type="module" src="enroll-mfa.js"></script>
<style>
  :root{ --ink:#20292b; --label:#69736f; --hair:#e3e6e1; --field:#f3f6f2; --green:#6f8c78; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
        background:var(--field); color:var(--ink); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  main{ width:min(420px,100%); background:#fff; border:1px solid var(--hair); border-radius:10px; padding:24px; }
  img{ height:38px; width:auto; }
  h1{ margin:18px 0 6px; font-size:23px; }
  p{ margin:0 0 16px; color:var(--label); font-size:13px; line-height:1.5; }
  label{ display:block; margin-top:11px; color:var(--label); font-size:11px; font-weight:700; }
  input{ width:100%; height:39px; margin-top:4px; padding:0 10px; border:1px solid var(--hair);
         border-radius:4px; color:var(--ink); font:13px inherit; }
  input:focus{ outline:none; border-color:var(--ink); }
  button,.back{ display:block; width:100%; min-height:39px; margin-top:16px; border:1px solid var(--green);
                background:var(--green); color:#fff; font:13px inherit; cursor:pointer; text-align:center;
                text-decoration:none; padding:10px; }
  button:disabled{ opacity:.55; cursor:default; }
  .back{ border-color:var(--hair); background:#fff; color:var(--ink); }
  .key{ padding:12px; background:var(--field); font:15px ui-monospace,SFMono-Regular,Menlo,monospace;
        overflow-wrap:anywhere; letter-spacing:.04em; }
  .open-app{ display:inline-block; margin:10px 0 4px; color:#4f6f5c; font-size:12px; }
  .msg{ min-height:18px; margin-top:11px; color:#943a25; font-size:12px; line-height:1.4; }
  .ok{ color:#2f6a45; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<main>
  <img src="../assets/fishtagged-logo.png" alt="Fishtagged">
  <h1>Set up a security code</h1>
  <p>Administrators use a changing code from an authenticator app in addition to
    their password.</p>

  <form id="signin">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Continue</button>
  </form>

  <section id="setup" hidden>
    <p>Add this setup key to Google Authenticator, Microsoft Authenticator,
      1Password, or another TOTP app.</p>
    <div class="key" id="secret"></div>
    <a class="open-app" id="openApp" href="#">Open in an authenticator app</a>
    <form id="verify">
      <label for="code">Current 6-digit code</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
        maxlength="8" pattern="[0-9 ]{6,8}" required>
      <button type="submit">Finish setup</button>
    </form>
  </section>

  <div class="msg" id="msg" aria-live="polite"></div>
  <a class="back" href="../index.html">Return to the map</a>
</main>
</body>
</html>
